<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — WA Automation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,sans-serif;background:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:440px;padding:24px;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px;}
.logo-icon{width:36px;height:36px;background:#1D9E75;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:20px;height:20px;fill:white;}
.logo-text{font-size:17px;font-weight:500;}
.card{background:white;border-radius:16px;border:0.5px solid rgba(0,0,0,0.08);padding:32px;}
.card h1{font-size:22px;font-weight:500;margin-bottom:6px;}
.card p{font-size:14px;color:#666;margin-bottom:28px;}
.tabs{display:flex;background:#f5f5f3;border-radius:8px;padding:4px;margin-bottom:24px;}
.tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:13px;cursor:pointer;color:#666;}
.tab.active{background:white;color:#1a1a1a;font-weight:500;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:12px;color:#666;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
input{width:100%;padding:10px 14px;border:0.5px solid rgba(0,0,0,0.12);border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:white;}
input:focus{border-color:#1D9E75;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px;}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:6px;cursor:pointer;color:#999;}
.eye-btn:hover{color:#1D9E75;background:#f5f5f3;}
.eye-btn svg{width:18px;height:18px;}
.eye-btn .eye-off{display:none;}
.eye-btn.showing .eye-on{display:none;}
.eye-btn.showing .eye-off{display:block;}
.btn{width:100%;padding:12px;background:#1D9E75;color:white;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;}
.btn:hover{background:#0F6E56;}
.error{color:#E24B4A;font-size:13px;margin-top:8px;display:none;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.row{grid-template-columns:1fr;gap:0;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <span class="logo-text">WA Automation</span>
  </div>
  <div class="card">
    <h1 id="form-title">Create your account</h1>
    <p id="form-sub">Start automating your WhatsApp in minutes</p>
    <div class="tabs">
      <div class="tab active" onclick="showTab('register', this)">Register</div>
      <div class="tab" onclick="showTab('login', this)">Login</div>
    </div>

    <div id="register-form">
      <div class="row">
        <div class="form-group"><label>Your name</label><input type="text" id="r-name" placeholder="Faith" /></div>
        <div class="form-group"><label>Business name</label><input type="text" id="r-bizname" placeholder="Mama Tope Kitchen" /></div>
      </div>
      <div class="form-group"><label>Email address</label><input type="email" id="r-email" placeholder="you@gmail.com" /></div>
      <div class="form-group"><label>WhatsApp number</label><input type="tel" id="r-phone" placeholder="+2348012345678" /></div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="r-password" placeholder="Min 6 characters" />
          <button type="button" class="eye-btn" onclick="togglePw('r-password', this)" aria-label="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="error" id="r-error"></div>
      <button class="btn" onclick="register()">Create account →</button>
    </div>

    <div id="login-form" style="display:none;">
      <div class="form-group"><label>Email address</label><input type="email" id="l-email" placeholder="you@gmail.com" /></div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="l-password" placeholder="Your password" />
          <button type="button" class="eye-btn" onclick="togglePw('l-password', this)" aria-label="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="error" id="l-error"></div>
      <button class="btn" onclick="login()">Login →</button>
    </div>
  </div>
</div>

<script>
function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.classList.toggle('showing', show);
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}

function showTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-title').textContent = tab === 'register' ? 'Create your account' : 'Welcome back';
  document.getElementById('form-sub').textContent = tab === 'register' ? 'Start automating your WhatsApp in minutes' : 'Login to your dashboard';
}

async function register() {
  const name = document.getElementById('r-name').value.trim();
  const bizname = document.getElementById('r-bizname').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const phone = document.getElementById('r-phone').value.trim();
  const password = document.getElementById('r-password').value;
  const errEl = document.getElementById('r-error');
  if (!name || !bizname || !email || !phone || !password) {
    errEl.textContent = 'Please fill in all fields';
    errEl.style.display = 'block';
    return;
  }
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, business_name: bizname, email, phone, password })
    });
    const data = await res.json();
    if (data.success) { window.location.href = '/onboarding'; }
    else { errEl.textContent = data.error || 'Registration failed'; errEl.style.display = 'block'; }
  } catch (err) {
    errEl.textContent = 'Something went wrong. Try again.';
    errEl.style.display = 'block';
  }
}

async function login() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  const errEl = document.getElementById('l-error');
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) { window.location.href = '/dashboard'; }
    else { errEl.textContent = data.error || 'Invalid email or password'; errEl.style.display = 'block'; }
  } catch (err) {
    errEl.textContent = 'Something went wrong. Try again.';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
