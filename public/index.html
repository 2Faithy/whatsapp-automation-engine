<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Automation Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      }
      .logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo h1 {
        color: #25d366;
        font-size: 24px;
      }
      .logo p {
        color: #666;
        font-size: 14px;
        margin-top: 4px;
      }
      .tabs {
        display: flex;
        margin-bottom: 24px;
        border-bottom: 2px solid #f0f0f0;
      }
      .tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        color: #666;
        font-weight: 500;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
      }
      .tab.active {
        color: #25d366;
        border-bottom-color: #25d366;
      }
      .form {
        display: none;
      }
      .form.active {
        display: block;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #444;
        margin-bottom: 6px;
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
      }
      input:focus {
        border-color: #25d366;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #25d366;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      button:hover {
        background: #1ea855;
      }
      .error {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 8px;
        display: none;
      }
      .success {
        color: #25d366;
        font-size: 13px;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>💬 WA Automation</h1>
        <p>Automate your WhatsApp customer service</p>
      </div>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <!-- Login Form -->
      <div class="form active" id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <div class="error" id="login-error"></div>
        <button onclick="login()">Login</button>
      </div>

      <!-- Register Form -->
      <div class="form" id="register-form">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Business Name</label>
          <input
            type="text"
            id="reg-business"
            placeholder="Mama Tope Kitchen"
          />
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="text" id="reg-phone" placeholder="+2348012345678" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" />
        </div>
        <div class="error" id="reg-error"></div>
        <div class="success" id="reg-success"></div>
        <button onclick="register()">Create Account</button>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".form")
          .forEach((f) => f.classList.remove("active"));
        document
          .querySelector(
            ".tab:" + (tab === "login" ? "first-child" : "last-child")
          )
          .classList.add("active");
        document.getElementById(tab + "-form").classList.add("active");
      }

      async function login() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        const error = document.getElementById("login-error");

        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          error.style.display = "block";
          error.textContent = data.error;
        }
      }

      async function register() {
        const name = document.getElementById("reg-name").value;
        const business_name = document.getElementById("reg-business").value;
        const whatsapp_number = document.getElementById("reg-phone").value;
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const error = document.getElementById("reg-error");
        const success = document.getElementById("reg-success");

        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            email,
            password,
            business_name,
            whatsapp_number,
          }),
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          error.style.display = "block";
          error.textContent = data.error;
        }
      }
    </script>
  </body>
</html>
