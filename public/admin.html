<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — WA Automation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--bg:#f5f5f3;--surface:#ffffff;--border:rgba(0,0,0,0.08);--text:#1a1a1a;--text2:#666;}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);}
.nav{background:var(--surface);border-bottom:0.5px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-brand{display:flex;align-items:center;gap:8px;}
.nav-icon{width:30px;height:30px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.nav-icon svg{width:16px;height:16px;fill:white;}
.admin-badge{background:#FFF3E0;color:#E65100;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;margin-left:8px;}
.main{max-width:1100px;margin:0 auto;padding:24px;}
.page-header{margin-bottom:24px;}
.page-header h1{font-size:22px;font-weight:500;}
.page-header p{font-size:14px;color:var(--text2);margin-top:4px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat{background:#f1f0eb;border-radius:8px;padding:16px;}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
.stat-value{font-size:24px;font-weight:500;}
.stat-value.green{color:var(--green);}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;}
.card-header{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.card-header h2{font-size:14px;font-weight:500;}
table{width:100%;border-collapse:collapse;}
th{padding:12px 20px;text-align:left;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;border-bottom:0.5px solid var(--border);font-weight:400;}
td{padding:14px 20px;font-size:14px;border-bottom:0.5px solid var(--border);}
tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.badge.active{background:var(--green-light);color:var(--green-dark);}
.badge.inactive{background:#f1f0eb;color:#999;}
.badge.pending{background:#FFF8E1;color:#F59E0B;}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.actions{display:flex;gap:8px;}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;}
.btn-activate{background:var(--green-light);color:var(--green-dark);}
.btn-deactivate{background:#FFF3E0;color:#E65100;}
.btn-delete{background:#FFEBEE;color:#C62828;}
.btn-view{background:#f1f0eb;color:var(--text2);}
.empty{padding:40px;text-align:center;color:var(--text2);font-size:14px;}
.search{padding:8px 14px;border:0.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;width:240px;}
.search:focus{border-color:var(--green);}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <span style="font-size:15px;font-weight:500;">WA Automation</span>
    <span class="admin-badge">ADMIN</span>
  </div>
  <div style="display:flex;gap:12px;align-items:center;">
    <a href="/dashboard" style="font-size:13px;color:var(--text2);text-decoration:none;">My Dashboard</a>
    <button onclick="logout()" style="background:none;border:0.5px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text2);">Logout</button>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <h1>Admin Panel</h1>
    <p>Manage all registered businesses</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total businesses</div><div class="stat-value green" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Active bots</div><div class="stat-value green" id="stat-active">—</div></div>
    <div class="stat"><div class="stat-label">Pending activation</div><div class="stat-value" id="stat-pending">—</div></div>
    <div class="stat"><div class="stat-label">Total conversations</div><div class="stat-value" id="stat-convs">—</div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>All Businesses</h2>
      <input class="search" placeholder="Search businesses..." oninput="filterTable(this.value)" />
    </div>
    <table>
      <thead>
        <tr>
          <th>Business</th>
          <th>Owner</th>
          <th>WhatsApp</th>
          <th>Status</th>
          <th>Registered</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="biz-table">
        <tr><td colspan="6" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let allBusinesses = [];

async function loadData() {
  try {
    const res = await fetch('/admin/businesses');
    if (res.status === 401 || res.status === 403) {
      window.location.href = '/login';
      return;
    }
    const data = await res.json();
    allBusinesses = data.businesses;

    document.getElementById('stat-total').textContent = data.stats.total;
    document.getElementById('stat-active').textContent = data.stats.active;
    document.getElementById('stat-pending').textContent = data.stats.pending;
    document.getElementById('stat-convs').textContent = data.stats.conversations;

    renderTable(allBusinesses);
  } catch (err) {
    console.error(err);
  }
}

function renderTable(businesses) {
  const tbody = document.getElementById('biz-table');
  if (businesses.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No businesses registered yet</td></tr>';
    return;
  }
  tbody.innerHTML = businesses.map(b => `
    <tr>
      <td><strong>${b.name}</strong></td>
      <td>${b.owner_name || '—'}<br/><span style="font-size:12px;color:#999;">${b.owner_email || ''}</span></td>
      <td>${b.whatsapp_number || '—'}</td>
      <td>
        <span class="badge ${b.active ? 'active' : b.whatsapp_status === 'qr_ready' ? 'pending' : 'inactive'}">
          <span class="badge-dot"></span>
          ${b.active ? 'Active' : b.whatsapp_status === 'qr_ready' ? 'Pending' : 'Inactive'}
        </span>
      </td>
      <td>${b.createdAt ? new Date(b.createdAt).toLocaleDateString() : '—'}</td>
      <td>
        <div class="actions">
          ${!b.active ? `<button class="btn btn-activate" onclick="activate('${b._id}')">Activate</button>` : `<button class="btn btn-deactivate" onclick="deactivate('${b._id}')">Deactivate</button>`}
          <button class="btn btn-delete" onclick="deleteBiz('${b._id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function filterTable(query) {
  const filtered = allBusinesses.filter(b =>
    b.name?.toLowerCase().includes(query.toLowerCase()) ||
    b.owner_email?.toLowerCase().includes(query.toLowerCase()) ||
    b.whatsapp_number?.includes(query)
  );
  renderTable(filtered);
}

async function activate(id) {
  await fetch('/admin/businesses/' + id + '/activate', { method: 'POST' });
  loadData();
}

async function deactivate(id) {
  await fetch('/admin/businesses/' + id + '/deactivate', { method: 'POST' });
  loadData();
}

async function deleteBiz(id) {
  if (!confirm('Are you sure you want to delete this business?')) return;
  await fetch('/admin/businesses/' + id, { method: 'DELETE' });
  loadData();
}

async function logout() {
  await fetch('/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}

loadData();
</script>
</body>
</html>
